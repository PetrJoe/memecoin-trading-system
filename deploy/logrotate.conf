/opt/meme-trader/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 memetrader memetrader
    sharedscripts
    postrotate
        # journald handles most logging; this covers any file-based logs
        systemctl kill -s HUP meme-trader.service >/dev/null 2>&1 || true
    endscript
}
